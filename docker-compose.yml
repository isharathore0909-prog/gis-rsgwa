services:
  rgw-server:
    build:
      context: ./BACK_END/rgwcma_gis_server
    image: shubhamdata690/rgwcma-gis-server:${RGW_VERSION}
    container_name: rgwcma-gis-server
    ports:
      - "8030:8000"
    env_file:
      - ./BACK_END/rgwcma_gis_server/.env
    volumes:
      - ./BACK_END/rgwcma_gis_server/media:/app/media
      - ./BACK_END/rgwcma_gis_server/data:/app/data
    restart: always
    networks:
      - rgw-network

  rgw-client:
    build:
      context: ./FRONT_END
    image: shubhamdata690/rgwcma-gis-client:${RGW_VERSION}
    container_name: rgwcma-gis-client
    ports:
      - "8031:80"
    depends_on:
      - rgw-server
    restart: always
    networks:
      - rgw-network

networks:
  rgw-network:
    driver: bridge
